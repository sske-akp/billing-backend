[project]
name = "sske-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi[standard]",
  "pydantic",
  "pydantic[email]",
  "uvicorn",
  "sqlalchemy",
  "psycopg2-binary",
  "alembic",
  "python-dotenv",
  "requests>=2.34.2",
  "bcrypt",
  "PyJWT",
  "python-multipart",
]

[project.scripts]
app = "main:app"
